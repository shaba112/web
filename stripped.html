<!DOCTYPE html>
<html>
<head>
<title>stripped table</title>
<style>
#studentTable{
  width:100%;
  border-collapse:collapse;
  font-family:sans-serif;
  }
#studentTable th{
  padding:20px;
  text-align:left;
  color:white;
  background-color:#b22222;
  border:1px solid grey;
  }
#studentTable td{
  padding:8px;
  border:1px solid grey;
  }
#studentTable tr:hover{
  background-color:burlywood;
  }
#studentTable even{
  background-color:#f2f2f2;
  }
</style>
</head>

<body>
